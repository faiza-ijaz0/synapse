name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test (ubuntu, Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container credentials, not a secret.
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://synapse:synapse@127.0.0.1:5432/synapse_test
      # Postgres is provided here, so integration tests must run: a missing
      # DATABASE_URL_TEST or any skipped *.int.test.ts test fails `pnpm test`.
      SYNAPSE_REQUIRE_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: License check (production dependencies)
        run: pnpm licenses list --prod

  windows:
    name: typecheck + unit tests (windows)
    runs-on: windows-latest
    env:
      # Intentionally database-free: no Postgres service on this runner, so
      # integration tests are skipped here. The ubuntu job requires them.
      SYNAPSE_REQUIRE_INTEGRATION_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Integration tests report as skipped (see the job env above).
      - run: pnpm test
